apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signalfloor.fullname" . }}-dashboard
  labels:
    {{- include "signalfloor.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "signalfloor.selector" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signalfloor.selector" (dict "root" . "component" "dashboard") | nindent 8 }}
    spec:
      securityContext:
        {{- include "signalfloor.podSecurity" . | nindent 8 }}
        # The image's user is "node" by name. Kubernetes can only check runAsNonRoot against
        # a numeric uid, so give it the uid that name has in the image.
        runAsUser: 1000
      containers:
        - name: dashboard
          image: {{ .Values.image.dashboard.repository }}:{{ .Values.image.dashboard.tag }}
          imagePullPolicy: {{ .Values.image.dashboard.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SIGNALFLOOR_API_URL
              value: http://{{ include "signalfloor.fullname" . }}-api:8000
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            {{- include "signalfloor.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # Next.js writes its cache here. The rest of the filesystem is read only.
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "signalfloor.fullname" . }}-dashboard
  labels:
    {{- include "signalfloor.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "signalfloor.selector" (dict "root" . "component" "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
