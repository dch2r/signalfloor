{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "signalfloor.databaseSecret" . }}
  labels:
    {{- include "signalfloor.labels" . | nindent 4 }}
type: Opaque
stringData:
  SIGNALFLOOR_DATABASE_URL: {{ include "signalfloor.databaseUrl" . | quote }}
{{- end }}
{{- if .Values.auth.apiKeys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "signalfloor.fullname" . }}-api-keys
  labels:
    {{- include "signalfloor.labels" . | nindent 4 }}
type: Opaque
stringData:
  SIGNALFLOOR_API_KEYS: {{ .Values.auth.apiKeys | quote }}
  SIGNALFLOOR_API_KEY: {{ .Values.auth.apiKeys | splitList "," | first | trim | quote }}
{{- end }}
