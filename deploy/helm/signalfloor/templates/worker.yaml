apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signalfloor.fullname" . }}-worker
  labels:
    {{- include "signalfloor.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "signalfloor.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signalfloor.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/database: {{ include "signalfloor.databaseUrl" . | sha256sum }}
    spec:
      # On SIGTERM the worker finishes its current job before exiting. Give it time to. A job
      # still running when this runs out is picked up again by another worker once its lease ends.
      terminationGracePeriodSeconds: 120
      securityContext:
        {{- include "signalfloor.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "signalfloor.serverImage" . }}
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          args: ["worker"]
          env:
            {{- include "signalfloor.serverEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "signalfloor.containerSecurity" . | nindent 12 }}
