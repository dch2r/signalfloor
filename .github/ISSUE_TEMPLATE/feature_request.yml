name: Feature request
description: Suggest something signalfloor should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you picture it working. Example commands or output help a lot.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
