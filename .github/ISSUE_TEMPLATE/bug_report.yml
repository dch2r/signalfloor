name: Bug report
description: Something does not work the way the docs say it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did you see?
      placeholder: |
        signalfloor compare base.jsonl cand.jsonl
        ...output or error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A few lines of the input files are usually enough. Remove anything private.
  - type: input
    id: version
    attributes:
      label: signalfloor version
      description: Output of `signalfloor --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: Python 3.12 on macOS 15
