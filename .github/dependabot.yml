version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # The types have to match the Node version we run, which .nvmrc pins to 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # openapi-typescript, which generates the API types, needs TypeScript 5.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Next.js, React and their types move together. One PR instead of five.
      react-and-next:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]

  # Base images in the Dockerfiles and docker-compose.yml are pinned by digest. These keep the
  # digests current.
  - package-ecosystem: docker
    directories: ["/packages/server", "/dashboard"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
