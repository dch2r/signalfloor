name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalfloor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNALFLOOR_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/signalfloor_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Check the API types match the server
        run: |
          uv run --locked signalfloor-server openapi > openapi.json
          npm run api:types
          git diff --exit-code -- openapi.json src/lib/api-types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack
        run: docker compose up --detach --build
      - name: Smoke test
        run: scripts/smoke-test.sh
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  kubernetes:
    name: Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint the chart
        run: |
          helm lint deploy/helm/signalfloor --strict
          # With no database configured, the chart must refuse to render.
          if helm template deploy/helm/signalfloor --set postgresql.enabled=false > /dev/null 2>&1; then
            echo "chart rendered without a database" >&2
            exit 1
          fi
      - name: Build the images
        run: |
          docker build -f packages/server/Dockerfile -t signalfloor-server:ci .
          docker build -t signalfloor-dashboard:ci dashboard
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: signalfloor
      - name: Load the images into the cluster
        run: kind load docker-image signalfloor-server:ci signalfloor-dashboard:ci --name signalfloor
      - name: Install
        run: |
          helm install signalfloor deploy/helm/signalfloor \
            --set image.server.tag=ci --set image.dashboard.tag=ci \
            --wait --wait-for-jobs --timeout 5m
      - name: Upgrade
        # A second release runs a second migration job and rolls the pods.
        run: |
          helm upgrade signalfloor deploy/helm/signalfloor --reuse-values \
            --set api.replicas=3 \
            --wait --wait-for-jobs --timeout 5m
          kubectl get jobs,deployments,pods
      - name: Smoke test
        run: |
          kubectl port-forward svc/signalfloor-api 8000:8000 &
          kubectl port-forward svc/signalfloor-dashboard 3000:3000 &
          scripts/smoke-test.sh
      - name: Show the cluster
        if: failure()
        run: |
          kubectl get all,jobs,pvc
          kubectl describe pods
          kubectl logs --all-containers --prefix --tail=50 -l app.kubernetes.io/instance=signalfloor

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare with no real change should pass
        uses: ./
        with:
          command: compare
          files: examples/baseline.jsonl examples/candidate-same.jsonl
          options: --seed 0

      - name: Calibrate a good judge should pass
        uses: ./
        with:
          command: calibrate
          files: |
            examples/judge.jsonl
            examples/human.jsonl
          options: --weights quadratic --seed 0

      - name: Compare with a real regression should fail
        id: regression
        continue-on-error: true
        uses: ./
        with:
          command: compare
          files: examples/baseline.jsonl examples/candidate-worse.jsonl
          options: --seed 0

      - name: Check the regression step failed with exit code 1
        env:
          OUTCOME: ${{ steps.regression.outcome }}
          EXIT_CODE: ${{ steps.regression.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$EXIT_CODE"
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 1
