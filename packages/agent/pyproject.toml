[project]
name = "signalfloor-agent"
version = "0.0.0"
description = "Reference RAG agent used to test and demo signalfloor."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Diwesh Chaurasia" }]
# Not published. This classifier makes PyPI refuse an accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "httpx>=0.27",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "numpy>=1.26",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]

[project.scripts]
signalfloor-agent = "signalfloor_agent.cli:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalfloor_agent"]
