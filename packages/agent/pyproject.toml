[project]
name = "signalfloor-agent"
version = "0.0.0"
description = "Reference RAG agent used to test and demo signalfloor."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Diwesh Chaurasia" }]
# Not published. This classifier makes PyPI refuse an accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalfloor_agent"]
