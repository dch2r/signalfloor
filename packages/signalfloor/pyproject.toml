[project]
name = "signalfloor"
version = "0.0.1"
description = "Find out if a drop in your LLM eval scores is a real regression or just noise."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Diwesh Chaurasia" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
signalfloor = "signalfloor.cli:main"

[project.urls]
Repository = "https://github.com/dch2r/signalfloor"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalfloor"]
