[project]
name = "signalfloor-server"
version = "0.0.0"
description = "HTTP API that stores eval runs and compares them with signalfloor."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Diwesh Chaurasia" }]
# Not published. This classifier makes PyPI refuse an accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "signalfloor",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
signalfloor-server = "signalfloor_server.__main__:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalfloor_server"]

[tool.uv.sources]
signalfloor = { workspace = true }
