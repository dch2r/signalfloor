# Workspace root. Not a package itself: each deployable or publishable unit
# lives under packages/ and is a uv workspace member.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-protobuf>=7.35.1.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["signalfloor", "signalfloor_agent", "signalfloor_server"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["packages/signalfloor/src", "packages/agent/src", "packages/server/src"]
files = [
    "packages/signalfloor/src",
    "packages/signalfloor/tests",
    "packages/agent/src",
    "packages/agent/tests",
    "packages/server/src",
    "packages/server/tests",
]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source = ["signalfloor", "signalfloor_agent", "signalfloor_server"]
branch = true
omit = ["*/__main__.py"]
# SQLAlchemy's async layer runs database calls in greenlets. Without this, every line after an
# await on the database is reported as never run.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# CI fails below this. The server tests need Postgres, so it holds for a full run only.
fail_under = 100
